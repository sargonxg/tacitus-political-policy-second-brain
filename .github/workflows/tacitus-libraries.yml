name: Tacitus library contracts
on:
  push:
    branches: [main, tacitus/development]
  pull_request:
permissions:
  contents: read
jobs:
  libraries:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, source-verified
        with:
          persist-credentials: false
      - name: Install pinned Rust development toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, already used by Node contracts
        with:
          node-version: '24'
      - name: Reproduce capsule-only release and cited examples
        run: python3 scripts/check-capsule-release.py "$RUNNER_TEMP/tacitus-capsule-check"
